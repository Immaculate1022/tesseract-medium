name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Import smoke test
        run: python -c "import tesseract_medium; print('import ok')"
      - name: Compile everything
        run: python -m compileall -q tesseract_medium examples
      - name: Run tensor-layer demo headless
        # PYTHONPATH: running examples/tensor_layer_demo.py puts examples/ (not repo root) on sys.path
        run: MPLBACKEND=Agg PYTHONPATH=${{ github.workspace }} python examples/tensor_layer_demo.py
